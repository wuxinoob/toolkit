name: CI

# 这个仓库此前没有任何 CI —— 验证一直是"在开发机上跑一遍"。
# 这里跑的就是那几条命令，没有额外的东西：
#
#   npm test        自动化测试（含守卫：文档 ↔ 代码、跨语言契约、主线程规则…）
#   npm run build   前端能否构建
#   host-checks     Rust 侧**唯一能跑起来**的校验入口
#                   （`cargo test` 在本项目里起不来：tauri-build 只把清单嵌进 bin 目标，
#                     测试二进制一加载就 STATUS_ENTRYPOINT_NOT_FOUND）
#
# **步骤顺序是有原因的，别随手调**：
#   前端 → Rust：Tauri 的编译期上下文要读前端产物目录，前端不先构建，Rust 编不过；
#   Rust → 测试：这条测试会读 tauri-build 生成的 ACL schema（见下）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支连推两次，取消前一次 —— 这个仓库的测试是秒级的，不值得排队。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: tests + build (windows)
    # Windows 优先：应用重度依赖 WebView2 与 ConPTY，别的平台上"能编译"证明不了什么。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Rust toolchain
        # 运行器自带 stable；这一行只是把它打进日志，出问题时省一次猜测。
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # 用 `npm install` 而不是 `npm ci`。
      #
      # 两者对"可选平台包"的校验强度不同，而且这个强度**随 npm 版本变**：同一份 lock，
      # npm 11.6 判它自洽，11.5 及更早则要求 tailwind 的 wasm 子树里还得有
      # `@emnapi/core` / `@emnapi/runtime` —— 那些包在 Windows 上永远不会被用到，
      # 却足以让 `npm ci` 直接 EUSAGE（第一次 CI 我们就是被这类报错挡住的：
      # `Missing: @tauri-apps/cli-darwin-arm64@… from lock file`，24 条）。
      # `npm install` 尊重 lock、不做这项校验，于是 CI 不再取决于 runner 自带哪个 npm；
      # 版本仍然由 lock 钉住。
      #
      # lock 里那些平台条目（`@tauri-apps/cli` ×11、`@rolldown/binding-*` ×15）是**必要的**，
      # 以及 `@emnapi/wasi-threads` 那条固定版本也是**有意**的（它让本地 `npm ci` 在 11.6 上通过）。
      # 这两样都别清理。
      - run: npm install --no-audit --no-fund
      - run: npm run build

      # Rust 步骤在测试之前，而且它顺便生成一个**测试要读的构建产物**：
      # `npm test` 里的权限审计会读 `src-tauri/gen/schemas/acl-manifests.json`，
      # 那是 tauri-build 生成的、被 gitignore 的 —— 干净检出里没有，本地早就有了，
      # 所以"我这儿绿、CI 红"（第一次跑就是这么崩在那个守卫里的）。
      #
      # 而且它写在**源码树**里（gen/schemas），不在 target 里 —— 我们缓存了 target，
      # 于是缓存命中时构建脚本可能是 no-op，那个文件永远不出现（间歇性红，最难查）。
      # 先只清这个包，强制构建脚本真的跑一遍，产物才是确定的。
      - name: Force the build script to run (it writes src-tauri/gen/schemas)
        run: cargo clean --manifest-path src-tauri/Cargo.toml -p toolbox

      - name: Rust checks (the runnable ones — also generate the ACL schemas)
        run: cargo run --manifest-path src-tauri/Cargo.toml --example host-checks

      - run: npm test
