name: Release

# 打 tag 就出一个带安装包的 GitHub Release。
#
# 为什么是 Windows 单平台：应用重度依赖 WebView2 与 ConPTY，别的平台上"编译成功"证明不了可交付。
#
# ## 现在能产出什么
#
#   NSIS 安装器（.exe）+ MSI（.msi）—— 两者都由 `tauri build` 按配置产出
#   *.sig —— 只有配了密钥才产出（见下）
#   latest.json —— 自动更新端点要的清单，由这次发布的产物推导（见 scripts/make-latest-json.mjs）
#
# ## 自动更新：还差的两件事都在仓库之外
#
#   1. **签名密钥进 Secrets**：`TAURI_SIGNING_PRIVATE_KEY`（私钥文件的整份内容，
#      或**该文件的绝对路径** —— CLI 两种都认）与 `TAURI_SIGNING_PRIVATE_KEY_PASSWORD`
#      （无口令则留空、不建这条也行）。
#      ⚠️ 没有这个 Secret 时**构建会失败**，不会静默降级：`createUpdaterArtifacts: true`
#      且配置里有 pubkey，CLI 会在签名那一步报
#      "A public key has been found, but no private key"。所以下面的步骤在缺密钥时
#      自动加上 `--no-sign`（产物照出，只是没有 .sig，latest.json 随之跳过），
#      配好密钥那天不用改这个文件。
#   2. **第一次带更新器的版本必须手动装**：没有更新器的旧版本不会自己更新自己。
#
# 端点：仓库里那份配置写的是真实地址（本地打出来的安装包也能自更新），而下面仍从
# `github.repository` 注入一次 —— 仓库改名时只需改仓库，不用改两处。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（形如 v0.1.0），必须与配置里的版本号一致'
        required: true

permissions:
  contents: write # gh release 需要

jobs:
  release:
    name: build + publish (windows)
    runs-on: windows-latest
    steps:
      # Tag push: `github.ref` IS the tag, which is what we want to build.
      # Manual dispatch: the input names an EXISTING tag — building the default
      # branch instead would attach different bytes to that tag's name, which is
      # the one thing a release must never do. (This was the behaviour until a
      # review pass caught it: the dispatch path checked out `main`.)
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-release-${{ runner.os }}-

      # 版本号只有一个地方说了算（配置里的版本），tag 只是它的别名。
      # 两者不一致时**立刻失败**：否则会发出一个"安装包说 0.1.0、release 叫 v0.2.0"的版本，
      # 而自动更新是靠比版本号工作的，这种漂移要等到用户端才暴露。
      - name: Check the tag matches the configured version
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "tag=$TAG version=$VERSION"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::tag $TAG 与配置里的版本 $VERSION 不一致 —— 先改版本号，或者用对的 tag 重跑"
            exit 1
          fi

      # 与 CI 同一条命令、同一个理由：`npm ci` 的"可选平台包"校验随 npm 版本变，
      # 而发布不该因为 runner 自带哪个 npm 而红。详见 ci.yml 里那段注释。
      - run: npm install --no-audit --no-fund

      # 发布前的门禁：测试不过就不出包。但测试**需要**一个 Rust 构建产物：
      # 权限审计读 `src-tauri/gen/schemas/acl-manifests.json`（tauri-build 生成、
      # 写在源码树里、被 gitignore）。所以先强制构建脚本跑一遍 —— 不清这个包的话，
      # 缓存命中时它是 no-op，那个文件就永远不出现。清它只影响本包，依赖仍走缓存。
      - run: cargo clean --manifest-path src-tauri/Cargo.toml -p toolkit
      - name: Generate the ACL schemas the tests read
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - run: npm test

      # 更新端点指向"这个仓库的最新发布"，所以在构建之前把地址写进应用配置。
      # 构建产物里嵌的是这一次写进去的值，之后改仓库地址不影响已经发出去的版本。
      - name: Point the updater at this repository
        shell: bash
        run: |
          node -e "const f='src-tauri/tauri.conf.json';const c=require('./'+f);c.plugins.updater.endpoints=['https://github.com/${{ github.repository }}/releases/latest/download/latest.json'];require('fs').writeFileSync(f,JSON.stringify(c,null,2)+'\n')"
          node -p "require('./src-tauri/tauri.conf.json').plugins.updater.endpoints[0]"

      # 有密钥才签名，没密钥就 `--no-sign`（见文件头第 1 条：缺密钥时构建会**失败**，
      # 不会自己跳过）。多行密钥必须用 GITHUB_ENV 的 heredoc 写法，直接 echo 会把换行吃掉。
      - name: Enable updater signing (only when the key is configured)
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEY" ]; then
            echo "updater signing: skipped (no TAURI_SIGNING_PRIVATE_KEY) — building with --no-sign"
            echo 'SIGN_FLAG=--no-sign' >> "$GITHUB_ENV"
            exit 0
          fi
          {
            echo 'TAURI_SIGNING_PRIVATE_KEY<<__KEY__'
            echo "$KEY"
            echo '__KEY__'
            echo 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD<<__PW__'
            echo "$KEY_PASSWORD"
            echo '__PW__'
          } >> "$GITHUB_ENV"
          echo "updater signing: enabled"

      # `tauri build` 会自己先跑前端构建（配置里的 beforeBuildCommand），不必手动再跑一次。
      # 用 `--` 把参数透传给 tauri：不带它时 npm 会把 `--no-sign` 当成自己的选项。
      # 读 `$SIGN_FLAG` 而不是 `${{ env.SIGN_FLAG }}` —— 后者在解析时就展开了，
      # 看不到上一步写进 GITHUB_ENV 的值（运行时才存在的东西只能从 shell 里读）。
      - name: Build bundles
        shell: bash
        run: npm run tauri -- build $SIGN_FLAG

      - name: Show what was produced
        shell: bash
        run: find src-tauri/target/release/bundle -type f | sort

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: toolkit-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/**/*.sig

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          FILES=$(ls src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/release/bundle/msi/*.msi 2>/dev/null || true)
          SIGS=$(ls src-tauri/target/release/bundle/**/*.sig 2>/dev/null || true)
          if [ -z "$FILES" ]; then
            echo "::error::没有产出任何安装包，检查上面的构建步骤"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG 已存在，改为补充/覆盖资产"
            gh release upload "$TAG" $FILES $SIGS --clobber
          else
            gh release create "$TAG" $FILES $SIGS --title "$TAG" --generate-notes
          fi

      # 更新清单。没有签名文件时脚本会打印告警并成功退出 —— 更新签名是可选的，
      # 不该拦住一次普通发布；配好密钥之后这一份就会自动出现在资产里。
      - name: Publish the updater manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          gh release view "$TAG" --json body -q .body > "$RUNNER_TEMP/notes.md" 2>/dev/null || : > "$RUNNER_TEMP/notes.md"
          node scripts/make-latest-json.mjs \
            --bundle src-tauri/target/release/bundle \
            --version "$VERSION" \
            --repo "${{ github.repository }}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --out "$RUNNER_TEMP/latest.json"
          if [ -f "$RUNNER_TEMP/latest.json" ]; then
            gh release upload "$TAG" "$RUNNER_TEMP/latest.json" --clobber
          fi
