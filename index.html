<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toolbox</title>
  </head>

  <body>
    <div id="app"></div>
    <!--
      Set the theme before the first paint. The bundled stylesheet is a separate
      <link> that applies before any module runs, so without this a light-theme
      user sees one dark frame on every window open. The key and the values are
      duplicated from src/host/theme.js on purpose — this has to run inline,
      before the module graph loads. Keep the two in sync.
    -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem('toolbox.theme');
          var dark = p === 'dark' || (p !== 'light' && !matchMedia('(prefers-color-scheme: light)').matches);
          var t = dark ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
