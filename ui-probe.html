<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <title>Toolbox · component factory probe</title>
    <link rel="icon" href="data:," />
    <script>
      // Same pre-paint theme read as index.html (see src/host/theme.js).
      (function () {
        try {
          var p = localStorage.getItem('toolbox.theme');
          var t =
            p === 'dark' || (p !== 'light' && !matchMedia('(prefers-color-scheme: light)').matches)
              ? 'dark'
              : 'light';
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/dev/ui-probe.js"></script>
  </body>
</html>
